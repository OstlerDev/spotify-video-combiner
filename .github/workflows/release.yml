name: Release Windows .exe

# Build dist\svc-gui.exe with PyInstaller and attach it to the GitHub Release.
#
# Triggers:
#   - release: published      -> normal path: build + upload to that release
#   - workflow_dispatch       -> manual smoke test: build only, exposed as a
#                                 workflow artifact (no release upload)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # required for `gh release upload`

jobs:
  build:
    name: Build svc-gui.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Pre-create the venv that build_exe.ps1 expects so it skips its own
      # install.ps1 bootstrap (which probes `py -3` / Microsoft-Store stubs
      # and is geared at end-user laptops, not CI).
      - name: Create venv and install package + build deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,build]"

      - name: Run test suite
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Build single-file .exe
        shell: pwsh
        run: .\build_exe.ps1

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: svc-gui-windows
          path: dist/svc-gui.exe
          if-no-files-found: error

      - name: Attach exe to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/svc-gui.exe --clobber
